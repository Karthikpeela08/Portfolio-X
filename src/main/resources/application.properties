# ====== CHANGE THESE TWO LINES TO MATCH YOUR MYSQL ======
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD
# ========================================================

# The database "portfoliox" is created automatically if it doesn't exist
spring.datasource.url=jdbc:mysql://localhost:3306/portfoliox?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Tables are created/updated automatically from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080
